sidebar_outlet:
  default: "sidebar-blocks"
  type: string

tier_cache_ttl:
  default: 10
  type: integer
  min: 1
  max: 1440

show_recent_badges:
  default: true
  type: bool

recent_badges_count:
  default: 6
  type: integer
  min: 1
  max: 20

# Total gamification points (all-time) that unlock the first badge of the last
# tier. The last tier's badge_ids list must begin with the badge awarded at this
# score; the second id is the "extraordinary contribution" badge.
karma_goal:
  default: 9999
  type: integer
  min: 1

tiers:
  type: objects
  default:
    - name: "user_badge.tiers.tier_1"
      badge_ids: ""
      group: []
    - name: "user_badge.tiers.tier_2"
      badge_ids: ""
      group: []
    - name: "user_badge.tiers.tier_3"
      badge_ids: ""
      group: []
  schema:
    name: tier
    identifier: name
    properties:
      name:
        type: string
        required: true
      badge_ids:
        type: string
      group:
        type: groups
        min: 0
        max: 1
