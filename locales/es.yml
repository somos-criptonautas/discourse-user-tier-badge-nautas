      karma_goal: "Puntuación de gamificación histórica que desbloquea el primer reto del último nivel. Solo se usa para el aviso «muy cerca». (Por defecto: 9999)"
      tiers: "Conjuntos de retos que componen cada nivel. `name` es una clave de traducción del componente bajo `user_badge.tiers`, `badge_ids` es una lista de ids de reto separados por comas y `group` es el grupo que también desbloquea el nivel. Un nivel se considera completo cuando se consiguieron todos los retos de su lista O la persona pertenece a su grupo (que puede venir de una suscripción o de una asignación manual); las filas se evalúan de arriba abajo y el bloque muestra el primero incompleto."
