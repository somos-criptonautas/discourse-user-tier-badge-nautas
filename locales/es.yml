es:
  theme_metadata:
    description: "Reto de perfil con progreso por niveles, para la barra lateral"
    settings:
      sidebar_outlet: "Punto de inserción de bloques donde se muestra el reto. El núcleo incluye `hero-blocks`, `homepage-blocks`, `main-outlet-blocks`, `sidebar-blocks` y `sidebar-discovery`. Vacío para colocar el bloque desde otro componente, con el nombre `theme:user-tier-badge:badge`."
      tier_cache_ttl: "Minutos que los retos conseguidos quedan en caché en el navegador. Reduce la carga del servidor al evitar volver a pedirlas en cada recarga de página. (Por defecto: 10)"
