en:
  theme_metadata:
    description: "User badge with custom tier progress, for use in a sidebar"
    settings:
      sidebar_outlet: "Block outlet the badge renders into. Core ships `hero-blocks`, `homepage-blocks`, `main-outlet-blocks`, `sidebar-blocks` and `sidebar-discovery`. Leave empty to place the block yourself from another theme, by the name `theme:user-tier-badge:badge`."
      tier_cache_ttl: "The duration (in minutes) for which earned badges are cached in the browser. Reduces server load by preventing re-fetching on every page refresh. (Default: 10)"
      karma_goal: "All-time gamification score that unlocks the first badge of the last tier. Used only for the \"almost there\" nudge. (Default: 9999)"
      tiers: "Badge sets that make up each tier. `name` is a theme locale key under `user_badge.tiers`, `badge_ids` is a comma-separated list of badge ids, `group` is the group that also unlocks the tier. A tier counts as complete when every badge in its list is earned OR the user holds its group (which a subscription or a manual grant can give); rows are evaluated top to bottom, and the block shows the first incomplete one."
  user_badge:
    stats:
      posts: "Posts"
      likes: "Likes"
      karma: "Karma"
    completed: "You have completed every tier. Thank you for being part of this."
    almost_there: "You are very close, just think outside the box"
    tiers:
      tier_1: "Tier 1"
      tier_2: "Tier 2"
      tier_3: "Tier 3"
      tier_4: "Tier 4"
