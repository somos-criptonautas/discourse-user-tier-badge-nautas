en:
  theme_metadata:
    description: "User badge with custom tier progress, for use in a sidebar"
    settings:
      sidebar_outlet: "Block outlet the badge renders into. Core ships `homepage-blocks` and `category-sidebar-blocks`; a theme may register others. Leave empty to place the block yourself from another theme, by the name `theme:user-tier-badge:badge`."
      tier_cache_ttl: "The duration (in minutes) for which earned badges are cached in the browser. Reduces server load by preventing re-fetching on every page refresh. (Default: 10)"
      tiers: "Badge sets that make up each tier. `name` is a theme locale key under `user_badge.tiers`, `badge_ids` is a comma-separated list of badge ids, `group` is the group unlocked by the tier, picked from the groups on this site. A tier counts as complete only when every badge in its list is earned; rows are evaluated top to bottom."
  user_badge:
    karma: "Karma"
    completed: "You have completed every tier. Thank you for being part of this."
    almost_there: "You are very close, just think outside the box"
    tiers:
      tier_1: "Tier 1"
      tier_2: "Tier 2"
      tier_3: "Tier 3"
